<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <line x1="128" y1="30" x2="128" y2="50"
        stroke="url(#robotGradient)"
        stroke-width="6"
        stroke-linecap="round"/>
  <circle cx="128" cy="22" r="8" fill="url(#robotGradient)"/>

  <!-- Head -->
  <rect x="58" y="50"
        width="140"
        height="120"
        rx="28"
        fill="url(#robotGradient)"/>

  <!-- Eyes -->
  <circle cx="95" cy="95" r="12" fill="#ffffff"/>
  <circle cx="161" cy="95" r="12" fill="#ffffff"/>

  <circle cx="95" cy="95" r="5" fill="#2563EB"/>
  <circle cx="161" cy="95" r="5" fill="#2563EB"/>

  <!-- Smile -->
  <path d="M95 128 Q128 150 161 128"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Side Ears -->
  <rect x="40" y="82"
        width="18"
        height="40"
        rx="8"
        fill="url(#robotGradient)"/>

  <rect x="198" y="82"
        width="18"
        height="40"
        rx="8"
        fill="url(#robotGradient)"/>

  <!-- Body -->
  <rect x="82"
        y="176"
        width="92"
        height="46"
        rx="16"
        fill="url(#robotGradient)"/>

  <!-- Buttons -->
  <circle cx="108" cy="198" r="5" fill="#ffffff"/>
  <circle cx="128" cy="198" r="5" fill="#ffffff"/>
  <circle cx="148" cy="198" r="5" fill="#ffffff"/>
</svg>